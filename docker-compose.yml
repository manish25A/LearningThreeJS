services:
  haunted-house:
    build: .
    # Remove the public port mapping here
    expose:
      - "5000"
    userns_mode: "keep-id"
    volumes:
      - .:/app:Z

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - haunted-house