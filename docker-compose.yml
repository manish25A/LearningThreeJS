services:
  haunted-house:
    build: .
    # Using 'expose' is correct; it stays internal to the pod
    expose:
      - "5000"
    volumes:
      - .:/app:Z 
    restart: always
    environment:
      - NODE_ENV=dev

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"   # Changed from 5000 to 8080 to avoid confusion
      - "8443:443"  # Changed to 8443 to avoid privileged port errors
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./certs:/etc/nginx/certs:ro # Added for SSL/HTTPS
    depends_on:
      - haunted-house
    restart: always